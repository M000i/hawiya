<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="css/picker.css" />
  </head>
  <body>
    <!-- Every visible text comes from picker/i18n/ (data-i18n); this file holds none (task 2.3). -->
    <header class="top">
      <div class="brand">
        <h1 data-i18n="app.name"></h1>
        <p class="sub" data-i18n="app.tagline"></p>
        <p class="stage" data-i18n="app.stage"></p>
      </div>
      <button
        type="button"
        class="lang-toggle"
        id="lang-toggle"
        data-i18n="lang.switchTo"
        data-i18n-attr="aria-label:lang.switchLabel"
      ></button>
    </header>

    <p class="notice" id="fonts-notice" role="note" data-i18n="notice.fonts"></p>
    <p class="notice notice-warn" id="fonts-offline" role="status" data-i18n="fonts.offline" hidden></p>
    <p class="notice notice-warn" id="storage-warning" role="alert" data-i18n="storage.unavailable" hidden></p>

    <main class="layout">
      <form class="controls" id="controls" autocomplete="off">
        <div class="rules" id="rules" aria-live="polite" hidden></div>
        <p class="note session-note" id="session-note" role="status" hidden></p>
        <section class="group identities" aria-labelledby="identity-title">
          <h2 id="identity-title" data-i18n="identity.title"></h2>
          <p class="note identity-lead" data-i18n="identity.lead"></p>
          <div class="identity-list" id="identity-list"></div>
          <p class="note" id="identity-empty" data-i18n="identity.empty" hidden></p>
        </section>

        <section class="group guided" id="guided" aria-labelledby="guided-title">
          <h2 id="guided-title" data-i18n="guided.title"></h2>
          <p class="note identity-lead" data-i18n="guided.lead"></p>
          <button type="button" id="guided-start" class="secondary-btn" data-i18n="guided.start"></button>
          <div id="guided-body" class="guided-body" hidden>
            <p id="guided-progress" class="note gd-progress"></p>
            <div id="guided-question">
              <h3 id="guided-heading" class="gd-heading" tabindex="-1"></h3>
              <p id="guided-hint" class="note"></p>
              <div id="guided-options" class="gd-all"></div>
            </div>
            <p id="guided-done" class="gd-done" tabindex="-1" hidden></p>
            <div class="gd-nav">
              <button type="button" id="guided-back" class="secondary-btn" data-i18n="guided.back"></button>
              <button type="button" id="guided-next" class="secondary-btn gd-next"></button>
              <button type="button" id="guided-advanced" class="secondary-btn" data-i18n="guided.toAdvanced"></button>
            </div>
          </div>
          <p id="guided-note" class="note gd-note" role="status" aria-live="polite"></p>
        </section>

        <fieldset class="group">
          <legend data-i18n="color.legend"></legend>
          <div class="swatches" id="swatches"></div>
          <label class="custom-color">
            <span data-i18n="color.custom"></span>
            <input type="color" id="color-input" name="color-custom" />
          </label>
        </fieldset>

        <fieldset class="group">
          <legend data-i18n="font.legend"></legend>
          <div class="fonts" id="fonts"></div>
        </fieldset>

        <fieldset class="group">
          <legend data-i18n="radius.legend"></legend>
          <div class="radius-row">
            <input
              type="range"
              id="radius-input"
              name="radius"
              min="0"
              max="24"
              step="2"
              data-i18n-attr="aria-label:radius.legend"
            />
            <output id="radius-value" for="radius-input" dir="ltr"></output>
          </div>
        </fieldset>

        <section class="group autofill" id="autofill" aria-labelledby="autofill-title" hidden>
          <h2 id="autofill-title" data-i18n="autofill.title"></h2>
          <p class="note" id="autofill-lead"></p>
          <button type="button" id="autofill-btn" class="export-btn" data-i18n="autofill.button"></button>
          <p class="note" id="autofill-note" role="status" aria-live="polite"></p>
        </section>

        <section class="group advanced" aria-labelledby="advanced-title">
          <h2 id="advanced-title" data-i18n="advanced.title"></h2>
          <p class="note identity-lead" data-i18n="advanced.lead"></p>
          <ul class="element-list" id="element-list"></ul>
        </section>

        <section class="group saved" aria-labelledby="saved-title">
          <h2 id="saved-title" data-i18n="saved.title"></h2>
          <label class="field" for="identity-name">
            <span data-i18n="saved.nameLabel"></span>
            <input
              type="text"
              id="identity-name"
              name="identity-name"
              maxlength="80"
              dir="auto"
              autocomplete="off"
              aria-describedby="identity-name-error"
            />
          </label>
          <p class="field-error" id="identity-name-error" data-i18n="saved.nameInvalid" hidden></p>
          <div class="saved-actions">
            <button type="button" id="save-btn" class="secondary-btn" data-i18n="saved.save"></button>
            <button type="button" id="save-new-btn" class="secondary-btn" data-i18n="saved.saveNew"></button>
          </div>
          <p class="note" id="saved-note" role="status" aria-live="polite"></p>
          <p class="note" id="saved-empty" data-i18n="saved.empty"></p>
          <ul class="saved-list" id="saved-list"></ul>
        </section>

        <section class="group export" aria-labelledby="export-title">
          <h2 id="export-title" data-i18n="export.title"></h2>
          <button type="button" id="export-btn" class="export-btn" data-i18n="export.button"></button>
          <div id="export-result" class="export-result" hidden>
            <p id="export-status" class="export-status" role="status" aria-live="polite"></p>
            <div class="export-actions" id="export-actions">
              <button type="button" id="copy-btn" class="secondary-btn" data-i18n="export.copy"></button>
              <button type="button" id="download-btn" class="secondary-btn" data-i18n="export.downloadZip"></button>
            </div>
            <p id="copy-status" class="note" role="status" aria-live="polite"></p>
            <textarea
              id="copy-fallback"
              class="copy-fallback"
              readonly
              hidden
              data-i18n-attr="aria-label:export.copyFallbackLabel"
              dir="ltr"
            ></textarea>
          </div>
        </section>
      </form>

      <section class="preview-wrap" aria-labelledby="preview-title">
        <div class="preview-head">
          <h2 id="preview-title" data-i18n="preview.title"></h2>
          <div class="preview-controls">
            <div class="seg" role="group" data-i18n-attr="aria-label:preview.langLabel">
              <button type="button" data-preview-lang="ar" aria-pressed="false" data-i18n="preview.ar"></button>
              <button type="button" data-preview-lang="en" aria-pressed="false" data-i18n="preview.en"></button>
            </div>
            <div class="seg" role="group" data-i18n-attr="aria-label:preview.modeLabel">
              <button type="button" data-preview-mode="light" aria-pressed="false" data-i18n="preview.light"></button>
              <button type="button" data-preview-mode="dark" aria-pressed="false" data-i18n="preview.dark"></button>
            </div>
          </div>
        </div>
        <div class="preview-scenes">
          <div class="seg seg-scenes" role="group" data-i18n-attr="aria-label:preview.sceneLabel">
            <button
              type="button"
              data-preview-scene="landing"
              aria-pressed="false"
              data-i18n="preview.scene.landing"
            ></button>
            <button
              type="button"
              data-preview-scene="dashboard"
              aria-pressed="false"
              data-i18n="preview.scene.dashboard"
            ></button>
            <button
              type="button"
              data-preview-scene="form"
              aria-pressed="false"
              data-i18n="preview.scene.form"
            ></button>
            <button
              type="button"
              data-preview-scene="mobile"
              aria-pressed="false"
              data-i18n="preview.scene.mobile"
            ></button>
          </div>
          <span class="approx-badge" id="approx-badge" data-i18n="preview.approximate" hidden></span>
        </div>
        <div id="preview" class="preview"></div>
        <p class="note" id="mobile-notice" data-i18n="notice.mobile"></p>
      </section>
    </main>

    <script src="i18n/ar.js"></script>
    <script src="i18n/en.js"></script>
    <script src="js/ui/i18n.js"></script>
    <script src="data/starter.js"></script>
    <script src="data/identities.js"></script>
    <script src="js/core/color.js"></script>
    <script src="js/core/contrast.js"></script>
    <script src="js/core/ramp.js"></script>
    <script src="js/core/modes.js"></script>
    <script src="js/core/recipe.js"></script>
    <script src="js/core/rules.js"></script>
    <script src="js/core/match.js"></script>
    <script src="js/core/scale.js"></script>
    <script src="js/core/schemas.js"></script>
    <script src="js/core/validate.js"></script>
    <script src="js/ui/session.js"></script>
    <script src="js/core/resolve.js"></script>
    <script src="js/core/autofill.js"></script>
    <script src="js/core/generate.js"></script>
    <script src="js/core/bundle.js"></script>
    <script src="js/core/zip.js"></script>
    <script src="js/core/export-format.js"></script>
    <script src="scenes/landing.js"></script>
    <script src="scenes/dashboard.js"></script>
    <script src="scenes/form.js"></script>
    <script src="scenes/mobile.js"></script>
    <script src="js/ui/preview.js"></script>
    <script src="js/ui/library.js"></script>
    <script src="js/ui/storage.js"></script>
    <script src="js/ui/state.js"></script>
    <script src="js/ui/rules-ui.js"></script>
    <script src="js/ui/identities.js"></script>
    <script src="js/ui/elements/numeric.js"></script>
    <script src="js/ui/elements/colors.js"></script>
    <script src="js/ui/elements/fonts.js"></script>
    <script src="js/ui/elements/icons.js"></script>
    <script src="js/ui/elements/components.js"></script>
    <script src="js/ui/elements/settings.js"></script>
    <script src="js/ui/gallery.js"></script>
    <script src="js/ui/autofill-ui.js"></script>
    <script src="js/ui/guided.js"></script>
    <script src="js/ui/app.js"></script>
    <script src="js/ui/export.js"></script>
  </body>
</html>
