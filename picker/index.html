<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hawiya</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #111827;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111827;
          --fg: #f9fafb;
        }
      }
      body {
        margin: 0;
        min-block-size: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 3rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hawiya</h1>
    </main>
  </body>
