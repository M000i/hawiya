<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hawiya</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="css/picker.css" />
  </head>
  <body>
    <header class="top">
      <h1>Hawiya</h1>
      <p class="sub">نسخة تجريبية: هوية واحدة وثلاثة اختيارات</p>
    </header>

    <div class="layout">
      <form class="controls" id="controls" autocomplete="off">
        <section class="group" aria-labelledby="identity-title">
          <h2 id="identity-title">الهوية الجاهزة</h2>
          <button type="button" class="identity" id="identity-btn" aria-pressed="true">
            <span class="identity-name">مؤسسي هادئ</span>
            <span class="identity-hint">أزرق محايد، خط واضح، زوايا معتدلة</span>
          </button>
        </section>

        <fieldset class="group">
          <legend>اللون الأساسي</legend>
          <div class="swatches" id="swatches"></div>
          <label class="custom-color">
            <span>لون مخصص</span>
            <input type="color" id="color-input" name="color-custom" />
          </label>
        </fieldset>

        <fieldset class="group">
          <legend>الخط</legend>
          <div class="fonts" id="fonts"></div>
          <p class="note">الخطوط تُحمَّل من Google Fonts وتحتاج اتصالًا بالإنترنت.</p>
        </fieldset>

        <fieldset class="group">
          <legend>الزوايا</legend>
          <div class="radius-row">
            <input type="range" id="radius-input" name="radius" min="0" max="24" step="2" />
            <output id="radius-value" for="radius-input"></output>
          </div>
        </fieldset>

        <section class="group export" aria-labelledby="export-title">
          <h2 id="export-title">التصدير</h2>
          <button type="button" id="export-btn" class="export-btn">تصدير</button>
          <div id="export-result" class="export-result" hidden>
            <p id="export-status" class="export-status" role="status" aria-live="polite"></p>
            <div class="export-actions" id="export-actions">
              <button type="button" id="copy-btn" class="secondary-btn">انسخ للوكيل</button>
              <div id="download-list" class="download-list"></div>
            </div>
            <p id="copy-status" class="note" role="status" aria-live="polite"></p>
            <textarea id="copy-fallback" class="copy-fallback" readonly hidden aria-label="نص النتيجة للنسخ اليدوي" dir="ltr"></textarea>
          </div>
        </section>
      </form>

      <section class="preview-wrap" aria-labelledby="preview-title">
        <h2 id="preview-title">المعاينة</h2>
        <div id="preview" class="preview"></div>
      </section>
    </div>

    <script src="js/core/generate.js"></script>
    <script src="js/core/export-format.js"></script>
    <script src="js/ui/preview.js"></script>
    <script src="js/ui/app.js"></script>
    <script src="js/ui/export.js"></script>
  </body>
</html>
