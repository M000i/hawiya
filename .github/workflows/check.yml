# Runs on every change: the unit and server tests, the library check, and makes sure the published page data
# (picker/data) is exactly what the library builds. Read-only: it changes nothing in the repository.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:
  # pages.yml runs this same check first and publishes only if it passes.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The save server tests also run the Python server, so Python must be there.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the development tools
        run: npm ci

      - name: Tests (npm test)
        run: npm test

      - name: Library check (npm run check)
        run: npm run check

      - name: picker/data matches the library
        run: |
          npm run build
          git status --porcelain -- picker/data
          if [ -n "$(git status --porcelain -- picker/data)" ]; then
            echo "picker/data is not what the library builds: run npm run build and commit picker/data." >&2
            exit 1
          fi
